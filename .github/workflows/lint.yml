name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: my-store/package-lock.json

      - run: npm ci

      - name: prettier
        run: npm run format:check

      - name: eslint
        run: npm run lint:check

      - name: typecheck
        run: npm run typecheck

      # The build prerenders product pages via generateStaticParams, so it needs
      # a database. Running migrations here also proves they apply from scratch.
      - name: migrate and seed
        run: npm run db:migrate && npm run db:seed

      - name: build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: my-store/package-lock.json

      - run: npm ci

      - name: install browsers
        run: npx playwright install --with-deps chromium

      - name: migrate and seed
        run: npm run db:migrate && npm run db:seed

      - name: playwright
        run: npm run test:e2e
        env:
          CI: "true"
          BETTER_AUTH_SECRET: ci-secret-not-used-outside-tests
          BETTER_AUTH_URL: http://localhost:3100

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: my-store/playwright-report/
          retention-days: 7
